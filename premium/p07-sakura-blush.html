<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Janith &amp; Dulani — Wedding Invitation</title>
<meta name="description" content="You are invited to celebrate our wedding.">
<meta property="og:title" content="Janith &amp; Dulani — Wedding Invitation">
<meta property="og:description" content="You are invited to celebrate our wedding. Tap to open your invitation.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#c0647a">
<!-- Template: Sakura Blush (Premium · Watercolor floral) — premium collection -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf3f4;--bg2:#fae8ea;--ink:#4a2f36;--muted:#8f6f77;--accent:#b85a72;--accent2:#c69a52;--gold:#c69a52;--gold-hi:#f1d9a3;--line:rgba(184,90,114,.25);--card:rgba(255,255,255,.8);--card-solid:#fffafa;--on-accent:#fff;--radius:18px;--in-radius:12px;--f-display:'Cormorant Garamond',serif;--f-script:'Great Vibes',cursive;--f-body:'Cormorant Garamond',serif;--f-native:'Cormorant Garamond',serif;--f-label:'Montserrat',sans-serif;--op-ink:#8f6f77;--op-names:#b85a72;--cv-btn:#fff;--cv-btn-bg:linear-gradient(135deg,#d57d93,#b85a72);--cv-btn-shadow:0 10px 24px -8px rgba(184,90,114,.7);--ph-bg:linear-gradient(160deg,#fbe3e7,#f2c9d1);--ph-ink:#b85a72;--ph-radius:16px}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden;height:100svh}
img,svg{display:block;max-width:100%}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
main{position:relative;z-index:1;overflow:hidden}
.sec{position:relative;padding:84px 20px;text-align:center}
.inner{max-width:760px;margin:0 auto;position:relative}
.native{font-family:var(--f-native)}
.st{font-family:var(--f-display);font-weight:400;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.2;color:var(--accent);letter-spacing:.04em}
.st-orn{width:120px;height:auto;margin:0 auto 14px;display:block}
.kicker{font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.rv{opacity:0;transform:translateY(30px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*140ms)}
.rv.vis{opacity:1;transform:none}
/* hero */
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 20px;position:relative;overflow:hidden}
.h-in{opacity:0;transform:translateY(22px)}
body.opened .h-in{animation:hin 1.3s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(.25s + var(--d,0)*.22s)}
@keyframes hin{to{opacity:1;transform:none}}
.names{font-family:var(--f-script);font-weight:400;font-size:clamp(3rem,14vw,6.2rem);line-height:1.08;color:var(--accent)}
.names .amp{display:block;font-size:.5em;line-height:1.1;color:var(--gold)}
.shimmer{background:linear-gradient(100deg,var(--gold) 0%,var(--gold) 35%,var(--gold-hi) 50%,var(--gold) 65%,var(--gold) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 5s linear infinite}
@keyframes shim{from{background-position:150% 0}to{background-position:-100% 0}}
.spin-slow{animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite alternate}
.glow{animation:glowp 2.2s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1) skewX(0)}40%{transform:scale(.92,1.08) skewX(3deg)}100%{transform:scale(1.04,.94) skewX(-3deg)}}
@keyframes glowp{from{opacity:.3}to{opacity:.65}}
.divider{width:min(320px,80vw);height:auto;margin:22px auto}
/* couple */
.host{max-width:560px;margin:0 auto 34px;font-style:italic;color:var(--muted)}
.couple{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;max-width:640px;margin:0 auto}
.couple h3{font-family:var(--f-display);font-weight:400;font-size:clamp(1.25rem,4.6vw,1.7rem);color:var(--accent);line-height:1.25;margin-bottom:6px}
.couple p{font-size:.88rem;color:var(--muted)}
.couple .and{font-family:var(--f-script);font-size:2.6rem;color:var(--gold)}
.invite-text{max-width:560px;margin:36px auto 0;font-size:1.06rem}
@media(max-width:520px){.couple{grid-template-columns:1fr}.couple .and{line-height:1}}
/* quote */
.quote blockquote{font-family:var(--f-display);font-size:clamp(1.15rem,4.4vw,1.55rem);line-height:1.55;max-width:600px;margin:0 auto;font-style:italic}
.quote cite{display:block;margin-top:16px;font-style:normal;font-size:.76rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
/* countdown */
.cd{display:flex;justify-content:center;gap:clamp(8px,2.6vw,16px);margin-top:30px}
.cd-box{width:clamp(66px,20vw,104px);padding:16px 4px 12px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius,4px)}
.cd-n{display:block;font-family:var(--f-display);font-size:clamp(1.7rem,7vw,2.5rem);line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.cd-l{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.cd-n.flip{animation:flip .55s ease}
@keyframes flip{0%{transform:rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}
.cd-date{margin-top:22px;color:var(--muted);letter-spacing:.1em}
/* events */
.events-grid{display:grid;gap:22px;margin-top:36px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.event{background:var(--card);border:1px solid var(--line);border-radius:var(--radius,4px);padding:34px 22px 28px;position:relative}
.ev-ico{width:54px;height:54px;margin:0 auto 12px}
.ev-ico svg{width:100%;height:100%}
.ev-name{font-family:var(--f-display);font-weight:400;font-size:1.45rem;color:var(--accent);line-height:1.25}
.ev-native{font-family:var(--f-native);color:var(--gold);font-size:1rem;margin-top:2px}
.ev-date{margin-top:14px;font-size:.92rem}
.ev-time{font-family:var(--f-display);font-size:1.12rem;color:var(--accent2,var(--accent));margin-top:2px}
.ev-venue{margin-top:12px;font-weight:600}
.ev-addr,.ev-note{font-size:.86rem;color:var(--muted)}
.ev-note{margin-top:8px;font-style:italic}
.ev-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:10px 20px;border-radius:var(--btn-radius,999px);background:var(--accent);color:var(--on-accent,#fff);border:1px solid var(--accent);font:inherit;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px -8px var(--accent)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* dress */
.dress p{max-width:520px;margin:10px auto 0}
.swatches{display:flex;gap:10px;justify-content:center;margin-top:18px}
.swatches span{width:30px;height:30px;border-radius:50%;border:1px solid var(--line)}
/* rsvp */
.rsvp-card{max-width:560px;margin:34px auto 0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius,4px);padding:32px 22px;text-align:left}
.field{margin-bottom:18px}
.field>label,.field>.lbl{display:block;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.field input[type=text],.field select,.field textarea{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--input-bg,transparent);border:1px solid var(--line);border-radius:var(--in-radius,3px);padding:11px 13px}
.field textarea{min-height:88px;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg label,.chk{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--in-radius,3px);padding:11px 12px;cursor:pointer;font-size:.95rem}
.chks{display:grid;gap:8px}
.seg input,.chk input{accent-color:var(--accent);width:18px;height:18px;flex:none}
.rsvp-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.rsvp-actions .btn{flex:1 1 200px}
.thanks{text-align:center;padding:20px 0}
.thanks .t-big{font-family:var(--f-script);font-size:2.8rem;color:var(--accent);line-height:1.1}
form.sent{display:none}
.deadline{margin-top:10px;color:var(--muted)}
/* footer */
footer{padding:70px 20px 110px;text-align:center}
.f-names{font-family:var(--f-script);font-size:clamp(2.2rem,9vw,3.4rem);color:var(--accent);line-height:1.1}
.f-tag{margin-top:10px;letter-spacing:.2em;color:var(--gold)}
.f-bless{margin-top:14px;font-family:var(--f-native);color:var(--muted)}
.brand{margin-top:34px;font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);opacity:.7}
/* floating RSVP */
.fab{position:fixed;right:16px;bottom:16px;z-index:30;opacity:0;transform:translateY(20px);pointer-events:none;transition:.5s;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
body.opened.scrolled .fab{opacity:1;transform:none;pointer-events:auto}
/* openers */
#opener{position:fixed;inset:0;z-index:100;cursor:pointer;overflow:hidden;transition:opacity .9s ease,visibility .9s}
#opener.gone{opacity:0;visibility:hidden}
.op-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:5;transition:opacity .5s,transform .6s}
#opener.opening .op-center{opacity:0;transform:scale(.92)}
.op-guest{font-family:var(--f-display);font-size:clamp(1.1rem,4.6vw,1.5rem);color:var(--op-ink);margin-top:22px;max-width:320px;line-height:1.35}
.op-tap{margin-top:14px;font-size:.66rem;letter-spacing:.34em;text-transform:uppercase;color:var(--op-ink);opacity:.8;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.op-seal{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--seal-hi),var(--seal) 60%,var(--seal-lo));box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 0 0 5px rgba(255,255,255,.08),inset 0 0 0 7px rgba(0,0,0,.12);color:var(--seal-ink);font-family:var(--f-display);font-size:1.9rem;letter-spacing:.06em;animation:sealb 2.4s ease-in-out infinite}
@keyframes sealb{50%{transform:scale(1.05)}}
/* doors */
.op-doors{perspective:1800px;background:var(--op-back,#000)}
.op-doors .door{position:absolute;top:0;bottom:0;width:50%;background:var(--op-bg);transition:transform 1.7s cubic-bezier(.7,0,.25,1);overflow:hidden;box-shadow:inset 0 0 60px rgba(0,0,0,.35)}
.op-doors .door.l{left:0;transform-origin:left center;border-right:1px solid var(--op-line)}
.op-doors .door.r{right:0;transform-origin:right center;border-left:1px solid var(--op-line)}
.op-doors.opening .door.l{transform:rotateY(-105deg)}
.op-doors.opening .door.r{transform:rotateY(105deg)}
.door-in{position:absolute;inset:18px;border:1px solid var(--op-line);display:flex;align-items:center;justify-content:center}
.door.r .door-in{transform:scaleX(-1)}
/* curtain */
.op-curtain{background:var(--op-back,#000)}
.op-curtain .cur{position:absolute;top:0;bottom:0;width:52%;background:var(--cur);transition:transform 1.8s cubic-bezier(.7,0,.25,1);z-index:2}
.op-curtain .cur.l{left:0;transform-origin:left top}
.op-curtain .cur.r{right:0;transform-origin:right top}
.op-curtain.opening .cur.l{transform:translateX(-96%) scaleX(.6)}
.op-curtain.opening .cur.r{transform:translateX(96%) scaleX(.6)}
.op-curtain .valance{position:absolute;left:0;right:0;top:0;height:74px;z-index:3;background:var(--valance);transition:transform 1.4s .4s}
.op-curtain.opening .valance{transform:translateY(-100%)}
/* envelope */
.op-env{background:var(--op-bg)}
.env{position:relative;width:min(84vw,380px);aspect-ratio:1.42;perspective:1200px}
.env>*{position:absolute}
.env-back{inset:0;background:var(--env-back);border-radius:6px}
.env-card{left:6%;right:6%;top:6%;bottom:8%;background:var(--card-solid,#fff);border-radius:4px;z-index:2;display:grid;place-items:center;text-align:center;padding:10px;transition:transform 1.1s .75s cubic-bezier(.3,.8,.3,1)}
.env-card .names{font-size:clamp(1.6rem,7vw,2.4rem)}
.env-front{inset:0;z-index:3;background:var(--env-front);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);border-radius:6px}
.env-flap{left:0;right:0;top:0;height:62%;z-index:4;background:var(--env-flap);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .8s ease,z-index 0s .4s;border-radius:6px 6px 0 0}
.env .op-seal{left:50%;top:58%;transform:translate(-50%,-50%);z-index:5;transition:opacity .4s,transform .4s;width:78px;height:78px;font-size:1.5rem;animation:none}
.op-env.opening .op-seal{opacity:0;transform:translate(-50%,-50%) scale(1.4)}
.op-env.opening .env-flap{transform:rotateX(180deg);z-index:1}
.op-env.opening .env-card{transform:translateY(-58%)}
.op-env .op-center{position:relative;inset:auto;height:100%;transition:none}
.op-env.opening .op-center{opacity:1;transform:none}
.op-env.opening .op-guest,.op-env.opening .op-tap{opacity:0;transition:opacity .4s}
/* minimal */
.op-min{background:var(--op-bg);transition:transform 1.2s cubic-bezier(.7,0,.25,1),opacity .9s,visibility .9s}
.op-min.opening{transform:translateY(-100%)}
.op-min .mono{font-family:var(--f-display);font-size:clamp(4rem,22vw,8rem);color:var(--op-ink);line-height:1;letter-spacing:.04em}
.op-min .line{display:block;width:0;height:1px;background:var(--op-ink);margin:22px auto 0;animation:grow 1.6s .3s forwards}
@keyframes grow{to{width:140px}}

.music{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:110;width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:var(--music-bg,rgba(255,255,255,.85));color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.2)}
.music .m-on{display:none}.music[aria-pressed=true] .m-on{display:block}.music[aria-pressed=true] .m-off{display:none}
.music[aria-pressed=true]::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--gold);animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
.music:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv,.h-in{opacity:1!important;transform:none!important}}


.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.eyebrow{font-family:var(--f-label,var(--f-body));font-size:.7rem;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.st{text-wrap:balance}
.st-sub{margin-top:64px}
.sec{scroll-margin-top:10px}
body{padding-bottom:0}
/* cover */
.cv-bg{position:absolute;inset:0;overflow:hidden;transition:transform 1.6s cubic-bezier(.6,0,.2,1),filter 1.6s}
.cv-bg canvas,.cv-bg>svg{position:absolute;inset:0;width:100%;height:100%}
.op-cover.opening .cv-bg,.op-env2.opening .cv-bg{transform:scale(1.12);filter:blur(3px)}
.op-cover .op-center{gap:0}
.cv-kicker,.e2-kick{font-family:var(--f-label,var(--f-body));font-size:.7rem;letter-spacing:.42em;text-transform:uppercase;color:var(--op-ink);opacity:.85}
.cv-rule{display:flex;align-items:center;gap:10px;margin:22px 0 18px;color:var(--gold)}
.cv-rule::before,.cv-rule::after{content:"";width:64px;height:1px;background:currentColor;opacity:.7}
.cv-rule i{width:7px;height:7px;background:currentColor;transform:rotate(45deg)}
.cv-names{font-family:var(--f-script);font-weight:400;font-size:clamp(2.2rem,10vw,3.4rem);color:var(--op-names,var(--accent));line-height:1.15}
.cv-names em{font-style:normal;color:var(--gold)}
.cv-date{margin-top:10px;color:var(--op-ink);font-size:1.02rem}
.cv-guest{margin-top:16px;font-style:italic;color:var(--op-ink)}
.cv-btn{margin-top:30px;display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border:1.5px solid var(--cv-btn,var(--accent));color:var(--cv-btn,var(--accent));border-radius:999px;font-family:var(--f-label,var(--f-body));font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;background:var(--cv-btn-bg,transparent);box-shadow:var(--cv-btn-shadow,none);animation:cvb 2.6s ease-in-out infinite}
@keyframes cvb{50%{transform:translateY(-3px)}}
.op-cover .op-center>*{animation:cvin 1.2s both}
.op-cover .op-center>*:nth-child(2){animation-delay:.15s}.op-cover .op-center>*:nth-child(3){animation-delay:.3s}.op-cover .op-center>*:nth-child(4){animation-delay:.45s}.op-cover .op-center>*:nth-child(5){animation-delay:.6s}.op-cover .op-center>.cv-btn{animation:cvin 1.2s .8s both,cvb 2.6s 2s ease-in-out infinite}
@keyframes cvin{from{opacity:0;transform:translateY(16px)}}
/* realistic curtain */
.op-cur2 .c2{position:absolute;top:0;bottom:0;width:50.6%;background:var(--cur2);z-index:2;transition:transform 2.1s cubic-bezier(.65,0,.25,1),filter 2.1s;box-shadow:0 0 40px rgba(0,0,0,.5)}
.op-cur2 .c2::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent 18%,transparent 70%,rgba(0,0,0,.4)),radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.08),transparent 60%)}
.op-cur2 .c2::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:radial-gradient(ellipse 22px 16px at 50% 0,transparent 96%,var(--cur-hem) 100%) 0 0/44px 34px repeat-x;opacity:.9}
.op-cur2 .c2.l{left:0;transform-origin:0 0}.op-cur2 .c2.r{right:0;transform-origin:100% 0}
.op-cur2.opening .c2.l{transform:scaleX(.14) skewY(4deg);filter:brightness(.8)}
.op-cur2.opening .c2.r{transform:scaleX(.14) skewY(-4deg);filter:brightness(.8)}
.op-cur2 .rod{position:absolute;top:0;left:0;right:0;height:var(--rod-h,0);background:var(--rod);z-index:3;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.op-cur2 .op-center{z-index:4}
.hand{color:var(--op-ink);animation:tapme 1.8s ease-in-out infinite}
.hand-wave{animation:pulse 1.8s infinite}
@keyframes tapme{0%,100%{transform:translateY(0)}40%{transform:translateY(6px) scale(.96)}}
/* envelope 2 */
.op-env2 .op-center{justify-content:space-between;padding:12svh 20px 9svh}
.e2-names{font-family:var(--f-script);font-size:clamp(1.8rem,8vw,2.4rem);color:var(--op-names,var(--gold));margin-top:8px}
.env2{position:relative;width:min(84vw,360px);aspect-ratio:1.45;perspective:1400px;filter:drop-shadow(0 22px 26px rgba(0,0,0,.35))}
.env2>*{position:absolute}
.e2-back{inset:0;background:var(--e2-inner);border-radius:4px}
.e2-letter{left:5%;right:5%;top:5%;height:88%;background:var(--card-solid);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform 1s .95s cubic-bezier(.3,.8,.3,1);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.e2-mono{font-family:var(--f-script);font-size:2.2rem;color:var(--accent)}
.e2-date{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.e2-front{inset:0;background:var(--e2-paper);clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);border-radius:4px}
.e2-front::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,transparent 40%,rgba(0,0,0,.12))}
.e2-flapw{left:0;right:0;top:0;height:64%;z-index:4;transform-origin:top center;transition:transform .9s .3s cubic-bezier(.5,0,.3,1),z-index 0s .75s;filter:drop-shadow(0 3px 3px rgba(0,0,0,.22))}

function drawSilk(cv,o){
 const W=cv.clientWidth||innerWidth,H=cv.clientHeight||innerHeight,sc=.5;

 const B=hex(o.base),S=hex(o.shadow),Hi=hex(o.hi||'#ffffff');
 let seed=o.seed||7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const ang=(o.angle||-30)*Math.PI/180,waves=[];
 for(let i=0;i<(o.n||6);i++){const a=ang+(rnd()-.5)*.5,f=(.006+rnd()*.012)/sc*(o.freq||1);
  waves.push({kx:Math.cos(a)*f,ky:Math.sin(a)*f,amp:(1.4+rnd()*1.6)/(1+i*.35),ph:rnd()*6.28})}
 const warp={kx:.0021/sc,ky:.0033/sc,amp:28*sc};
 const L=[-.45,-.55,.7],ln=Math.hypot(...L);L[0]/=ln;L[1]/=ln;L[2]/=ln;

 const str=o.strength||1,sp=o.spec||.26,ex=o.exp||16;

  gx*=11*str;gy*=11*str;

  for(const p of ps){p.sw+=.012;p.y+=p.vy*dir;p.x+=p.vx+Math.sin(p.sw)*.35*dpr;p.r+=p.vr;
   if((dir>0&&p.y>h+60*dpr)||(dir<0&&p.y<-60*dpr)||p.x<-80*dpr||p.x>w+80*dpr)Object.assign(p,mk(false));

   if(P.glow){x.shadowBlur=P.glow*dpr;x.shadowColor=p.c}S[P.type](p);x.restore()}
  requestAnimationFrame(loop)};requestAnimationFrame(loop)}

<script>/* WeddingMusic — culture-specific background music synthesised live with Web Audio.
   Styles: magulbera (Sinhala Kandyan drums + horanewa), magulflute (softer drums + flute),
   mangala (Tamil nadaswaram + thavil + tanpura), daf (frame drum only),
   organ (church organ, Pachelbel's Canon), musicbox (soft music box / piano).
   Set WEDDING.music to an .mp3 URL to use a real recording instead. */
window.WeddingMusic = (() => {
  let ac, master, dry, send, NB, timer, t0, tick = 0, S;
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const R = Math.random;

  function build(ctx) {
    ac = ctx;
    master = ac.createGain(); master.gain.value = 0;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
    master.connect(comp); comp.connect(ac.destination);
    const rev = ac.createConvolver(), len = ac.sampleRate * 2.8, b = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (R() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
    rev.buffer = b;
    dry = ac.createGain(); dry.connect(master);
    send = ac.createGain(); send.gain.value = .5; send.connect(rev); rev.connect(master);
    NB = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const nd = NB.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = R() * 2 - 1;
  }
  const route = (node, wet = .25) => { node.connect(dry); const g = ac.createGain(); g.gain.value = wet; node.connect(g); g.connect(send); };
  const env = (g, t, a, v, d) => { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0008, t + a + d); };
  const noise = () => { const s = ac.createBufferSource(); s.buffer = NB; s.loop = true; return s; };

  /* ---------------- percussion ---------------- */
  function membrane(t, f0, f1, v, dec, wet = .12) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dec * .7);
    env(g, t, .003, v, dec); o.connect(g); route(g, wet); o.start(t); o.stop(t + dec + .05);
  }
  function slap(t, fc, q, v, dec, tone, wet = .15) {
    const n = noise(), f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = 'bandpass'; f.frequency.value = fc; f.Q.value = q;
    env(g, t, .002, v, dec); n.connect(f); f.connect(g); route(g, wet); n.start(t, R()); n.stop(t + dec + .05);
    if (tone) membrane(t, tone * 1.3, tone, v * .5, dec * 1.2, wet);
  }
  function metal(t, v, dec, base = 520) {
    const g = ac.createGain(), hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5200;
    env(g, t, .002, v, dec); hp.connect(g); route(g, .35);
    [2, 3, 4.16, 5.43, 6.79, 8.21].forEach(r => { const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = base * r; o.connect(hp); o.start(t); o.stop(t + dec + .05); });
  }

  /* ---------------- melodic voices ---------------- */
  let lastReed = 0;
  function reed(t, dur, m, v, o = {}) {           // horanewa / nadaswaram style double reed
    const f = hz(m), g = ac.createGain(), bp = ac.createBiquadFilter(), pk = ac.createBiquadFilter(), lp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = o.formant || 1300; bp.Q.value = .8;
    pk.type = 'peaking'; pk.frequency.value = (o.formant || 1300) * 2.1; pk.gain.value = 7; pk.Q.value = 2;
    lp.type = 'lowpass'; lp.frequency.value = o.lp || 5200;
    const a = ac.createOscillator(), b = ac.createOscillator(); a.type = 'sawtooth'; b.type = 'square'; b.detune.value = 7;
    const gb = ac.createGain(); gb.gain.value = .35;
    const vib = ac.createOscillator(), vg = ac.createGain(); vib.frequency.value = o.vibHz || 5.6; vg.gain.value = f * (o.vib || .012);
    vib.connect(vg); vg.connect(a.frequency); vg.connect(b.frequency);
    const from = lastReed && o.glide !== 0 ? lastReed : f;
    [a, b].forEach(x => { x.frequency.setValueAtTime(from, t); x.frequency.exponentialRampToValueAtTime(f, t + (o.glide || .05)); });
    if (o.gamaka) [a, b].forEach(x => { const k = hz(m + o.gamaka) ; x.frequency.setValueAtTime(f, t + dur * .45); x.frequency.exponentialRampToValueAtTime(k, t + dur * .6); x.frequency.exponentialRampToValueAtTime(f, t + dur * .8); });
    lastReed = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .035); g.gain.setValueAtTime(v * .85, t + Math.max(.05, dur - .06)); g.gain.linearRampToValueAtTime(0, t + dur);
    a.connect(bp); b.connect(gb); gb.connect(bp); bp.connect(pk); pk.connect(lp); lp.connect(g); route(g, o.wet || .3);
    [a, b, vib].forEach(x => { x.start(t); x.stop(t + dur + .05); });
  }
  function flute(t, dur, m, v) {
    const f = hz(m), g = ac.createGain(), o = ac.createOscillator(), o2 = ac.createOscillator(), g2 = ac.createGain();
    o.type = 'sine'; o2.type = 'triangle'; o.frequency.value = f; o2.frequency.value = f * 2; g2.gain.value = .12;
    const vib = ac.createOscillator(), vg = ac.createGain(); vib.frequency.value = 5; vg.gain.value = f * .008; vib.connect(vg); vg.connect(o.frequency);
    const n = noise(), bp = ac.createBiquadFilter(), ng = ac.createGain(); bp.type = 'bandpass'; bp.frequency.value = f * 2; bp.Q.value = 3; ng.gain.value = .06;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .08); g.gain.setValueAtTime(v * .8, t + Math.max(.1, dur - .1)); g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g); o2.connect(g2); g2.connect(g); n.connect(bp); bp.connect(ng); ng.connect(g); route(g, .45);
    [o, o2, vib].forEach(x => { x.start(t); x.stop(t + dur + .05); }); n.start(t, R()); n.stop(t + dur + .05);
  }
  function tanpura(t, m, v) {
    const o = ac.createOscillator(), lp = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'sawtooth'; o.frequency.value = hz(m); lp.type = 'lowpass'; lp.frequency.setValueAtTime(3200, t); lp.frequency.exponentialRampToValueAtTime(500, t + 2.4);
    env(g, t, .01, v, 3); o.connect(lp); lp.connect(g); route(g, .4); o.start(t); o.stop(t + 3.1);
  }
  function organ(t, dur, m, v) {
    const g = ac.createGain(), f = hz(m);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .06); g.gain.setValueAtTime(v, t + dur - .02); g.gain.linearRampToValueAtTime(0, t + dur + .25);
    [[1, .5], [2, .32], [3, .16], [4, .14], [6, .06], [8, .05]].forEach(([h, a], i) => {
      const o = ac.createOscillator(), og = ac.createGain(); o.frequency.value = f * h; o.detune.value = i % 2 ? 3 : -2; og.gain.value = a;
      o.connect(og); og.connect(g); o.start(t); o.stop(t + dur + .3);
    });
    route(g, .7);
  }
  function bell(t, m, v, o = {}) {
    const a = ac.createOscillator(), b = ac.createOscillator(), g = ac.createGain(), gb = ac.createGain();
    a.frequency.value = hz(m); b.frequency.value = hz(m) * (o.bell ? 2.76 : 3.01); gb.gain.value = o.bell ? .22 : .1;
    b.connect(gb); gb.connect(g); a.connect(g); env(g, t, .005, v, o.decay || 1.9); route(g, .4);
    a.start(t); b.start(t); a.stop(t + 2.4); b.stop(t + 2.4);
  }
  function pad(t, notes, dur, v) {
    notes.forEach(n => { const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter(); o.type = 'triangle'; o.frequency.value = hz(n);
      f.type = 'lowpass'; f.frequency.value = 800; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 1.2); g.gain.linearRampToValueAtTime(0, t + dur);
      o.connect(f); f.connect(g); route(g, .5); o.start(t); o.stop(t + dur + .1); });
  }

  /* ---------------- styles ---------------- */
  // Melodies are written as [scale-degree or null, length in ticks]
  const seq = phr => { const out = []; phr.forEach(p => p.forEach(n => out.push(n))); return out; };
  const STYLES = {
    /* Sinhala magul bera: geta bera strokes (thom = bass, tha = slap), thalampata, horanewa lead */
    magulbera(o) {
      const bpm = o.bpm || 112, tk = 60 / bpm / 2;   // eighth-note ticks
      const scale = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16], root = o.root || 69;
      const drum = ['B', '.', 'S', 'S', 'B', 'S', '.', 'S', 'B', '.', 'S', 'B', 'S', 'S', 'B', '.'];
      const fill = ['S', 'S', 'S', 'S', 'B', 'S', 'S', 'S', 'B', 'B', 'S', 'S', 'S', 'S', 'B', 'B'];
      const mel = seq([
        [[0, 2], [2, 1], [4, 1], [4, 2], [5, 1], [4, 1], [2, 2], [0, 2], [2, 2], [null, 2]],
        [[2, 1], [4, 1], [5, 2], [7, 2], [5, 1], [4, 1], [5, 2], [4, 1], [2, 1], [4, 4]],
        [[7, 2], [7, 1], [8, 1], [7, 2], [5, 2], [4, 1], [5, 1], [7, 2], [5, 2], [null, 2]],
        [[4, 1], [2, 1], [1, 1], [0, 1], [1, 2], [2, 2], [1, 1], [0, 1], [-1, 2], [0, 4]],
      ]);
      let mi = 0, wait = 0, bar = 0;
      return { tk, step(t, i) {
        const pos = i % 16; if (pos === 0) bar++;
        const p = (bar % 4 === 0 ? fill : drum)[pos];
        if (p === 'B') membrane(t, 150, 72, .9, .42);
        if (p === 'S') slap(t, 1500 + R() * 300, 1.4, .55 + R() * .15, .08, 330);
        if (pos % 4 === 0) metal(t, pos === 0 ? .1 : .06, pos === 0 ? .35 : .15);
        if (i >= 32) {                       // lead enters after two bars
          if (wait-- <= 0) { const [d, l] = mel[mi % mel.length]; mi++; wait = l - 1;
            if (d !== null) { const m = root + (d < 0 ? -1 : scale[d]); reed(t, l * tk * .96, m, .16, { formant: 1500, vib: .01, glide: .04 }); } }
        }
      } };
    },
    /* softer: flute lead, gentle bera */
    magulflute(o) {
      const bpm = o.bpm || 84, tk = 60 / bpm / 2, scale = [0, 2, 4, 5, 7, 9, 11, 12, 14], root = o.root || 74;
      const mel = seq([
        [[4, 3], [5, 1], [4, 2], [2, 2], [0, 4], [null, 4]],
        [[2, 2], [4, 2], [5, 2], [7, 2], [5, 3], [4, 1], [2, 4]],
        [[7, 3], [8, 1], [7, 2], [5, 2], [4, 2], [5, 2], [4, 4]],
        [[2, 2], [1, 2], [0, 2], [1, 2], [0, 6], [null, 2]],
      ]);
      let mi = 0, wait = 0;
      return { tk, step(t, i) {
        const pos = i % 16;
        if (pos === 0 || pos === 10) membrane(t, 140, 70, .55, .45);
        if (pos === 4 || pos === 12 || (pos === 14 && R() < .5)) slap(t, 1400, 1.2, .25, .07, 300);
        if (pos % 8 === 0) metal(t, .045, .3);
        if (i >= 16 && wait-- <= 0) { const [d, l] = mel[mi % mel.length]; mi++; wait = l - 1; if (d !== null) flute(t, l * tk, root + scale[d], .2); }
        if (pos === 0 && i % 64 === 0) pad(t, [root - 24, root - 17], tk * 64, .03);
      } };
    },
    /* Tamil mangala vadyam: nadaswaram in raga Mohanam, thavil, talam, tanpura */
    mangala(o) {
      const bpm = o.bpm || 88, tk = 60 / bpm / 4, sa = o.root || 67;   // 16th ticks
      const moh = [0, 2, 4, 7, 9, 12, 14, 16];                          // S R2 G3 P D2 S' R' G'
      const thavil = ['D', '.', 't', 't', 'D', 't', '.', 't', 'D', '.', 't', '.', 'D', 't', 't', 't'];
      const mel = seq([
        [[0, 4], [1, 2], [2, 2], [3, 8], [2, 2], [1, 2], [0, 4], [1, 8]],
        [[2, 4], [3, 4], [4, 4], [5, 8], [4, 2], [3, 2], [2, 4], [3, 8]],
        [[4, 2], [3, 2], [4, 4], [5, 4], [6, 4], [5, 4], [4, 2], [3, 2], [2, 8]],
        [[3, 4], [2, 2], [1, 2], [2, 4], [1, 2], [0, 2], [1, 4], [0, 12]],
      ]);
      let mi = 0, wait = 0;
      return { tk, step(t, i) {
        const pos = i % 16, beat = Math.floor(i / 4) % 8;
        const p = thavil[pos];
        if (p === 'D') membrane(t, 120, 62, .7, .35);
        if (p === 't') slap(t, 2600 + R() * 500, 2, .42 + R() * .12, .05, 0);
        if (pos % 4 === 0 && (beat === 0 || beat === 4 || beat === 6)) metal(t, .07, .5, 700);
        if (i % 8 === 0) { const c = Math.floor(i / 8) % 4; tanpura(t, c === 0 ? sa - 17 : c === 3 ? sa - 24 : sa - 12, .06); }
        if (i >= 32 && wait-- <= 0) { const [d, l] = mel[mi % mel.length]; mi++; wait = l - 1;
          reed(t, l * tk * .98, sa + moh[d], .17, { formant: 1100, lp: 4200, vib: .006, vibHz: 4.5, glide: .07, gamaka: l >= 8 ? 1 : 0, wet: .35 }); }
      } };
    },
    /* frame drum only (dum / tak with jingles) */
    daf(o) {
      const bpm = o.bpm || 92, tk = 60 / bpm / 2;
      const pat = ['D', '.', 'T', '.', 'T', 'D', 'T', '.', 'D', '.', 'T', '.', 'T', 'T', 'D', 'T'];
      return { tk, step(t, i) {
        const p = pat[i % 16];
        if (p === 'D') { membrane(t, 95, 58, .75, .5, .3); slap(t, 400, .7, .12, .12, 0); }
        if (p === 'T') { slap(t, 3000, 1.5, .28 + R() * .1, .06, 0); metal(t, .03, .12, 900); }
      } };
    },
    /* church organ: Pachelbel's Canon in D (public domain) */
    organ(o) {
      const bpm = o.bpm || 58, tk = 60 / bpm;       // quarter-note ticks
      const bass = [50, 45, 47, 42, 43, 38, 43, 45];
      const chords = [[62, 66, 69], [61, 64, 69], [62, 66, 71], [61, 66, 69], [62, 67, 71], [62, 66, 69], [62, 67, 71], [61, 64, 69]];
      const v2 = [78, 76, 74, 73, 71, 69, 71, 73], v3 = [74, 73, 71, 69, 67, 66, 67, 64];
      const v4 = [74, 78, 81, 79, 78, 74, 78, 76, 74, 71, 74, 81, 79, 83, 81, 79];
      return { tk, step(t, i) {
        const cyc = Math.floor(i / 16), pos = i % 16, k = Math.floor(pos / 2);
        if (pos % 2 === 0) { organ(t, tk * 2 * .98, bass[k], .2); organ(t, tk * 2 * .98, bass[k] - 12, .1); chords[k].forEach(n => organ(t, tk * 2 * .98, n, .045)); }
        const c = cyc === 0 ? 0 : 1 + (cyc - 1) % 3;
        if (c === 1 && pos % 2 === 0) organ(t, tk * 2 * .96, v2[k], .09);
        if (c === 2 && pos % 2 === 0) organ(t, tk * 2 * .96, v3[k], .09);
        if (c === 3) organ(t, tk * .94, v4[pos], .085);
      } };
    },
    /* soft music box / piano (modern, luxury, garden) */
    musicbox(o) {
      const bpm = o.bpm || 68, tk = 60 / bpm / 2, key = o.key || 62;
      const prog = o.prog || [[0, 4, 7], [7, 11, 14], [9, 12, 16], [5, 9, 12]], pat = o.pattern || [0, 1, 2, 1, 3, 2, 1, 2];
      return { tk, step(t, i) {
        const ch = prog[Math.floor(i / 8) % prog.length], s = i % 8;
        if (s === 0) pad(t, ch.map(n => key - 12 + n), tk * 8 + .8, .045);
        const p = pat[s]; if (p >= 0 && R() < .92) bell(t, key + 12 + (p === 3 ? ch[0] + 12 : ch[p % 3]), .2 + R() * .08, o);
      } };
    },
  };

  /* ---------------- player ---------------- */
  let playing = false, audio = null, btn = null, cfg = {};
  function schedule() { while (t0 < ac.currentTime + 1.2) { S.step(t0, tick++); t0 += S.tk; } }
  function startSynth() {
    if (!ac) { build(new (window.AudioContext || window.webkitAudioContext)()); S = (STYLES[cfg.style] || STYLES.musicbox)(cfg); t0 = ac.currentTime + .15; }
    ac.resume(); master.gain.cancelScheduledValues(ac.currentTime); master.gain.setTargetAtTime(cfg.volume || .5, ac.currentTime, .6);
    schedule(); clearInterval(timer); timer = setInterval(schedule, 200);
  }
  function stopSynth() { if (!ac) return; master.gain.setTargetAtTime(0, ac.currentTime, .15); clearInterval(timer); setTimeout(() => { if (!playing) ac.suspend(); }, 600); }
  const set = v => { playing = v; if (btn) btn.setAttribute('aria-pressed', v); };
  function play() {
    try {
      if (cfg.url) { audio = audio || Object.assign(new Audio(cfg.url), { loop: true }); audio.play().then(() => set(true)).catch(() => {}); }
      else { set(true); startSynth(); }
    } catch (_) {}
  }
  function stop() { if (audio) audio.pause(); set(false); stopSynth(); }
  return {
    STYLES,
    init(button, c) { btn = button; cfg = c || {}; if (btn) btn.addEventListener('click', e => { e.stopPropagation(); playing ? stop() : play(); }); },
    play, stop, get playing() { return playing; },
    /* fresh player for a given style (used for samples on the website) */
    create(c) { return { play() { if (ac) { clearInterval(timer); try { ac.close(); } catch (_) {} } ac = null; cfg = Object.assign({}, c); tick = 0; lastReed = 0; set(true); startSynth(); }, stop() { stop(); } }; },
    /* offline render helper for testing */
    render(ctx, style, o, secs) { build(ctx); master.gain.value = o.volume || .5; S = STYLES[style](o); t0 = 0; tick = 0; while (t0 < secs) { S.step(t0, tick++); t0 += S.tk; } },
  };
})();
</script>

 const M=Object.assign({style:'musicbox'},T.music||{});M.url=W.music||'';WeddingMusic.init(b,M);
 const op=document.getElementById('opener');if(op&&W.musicOnOpen!==false)op.addEventListener('click',()=>{if(!WeddingMusic.playing)WeddingMusic.play()},{once:true});})();</script>
